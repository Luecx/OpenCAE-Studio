<!doctype html><html><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>OpenCAE FRD Viewer</title><link rel='stylesheet' href='./styles.css'></head><body><header><div class='brand'>OpenCAE <span>FRD Viewer</span></div><label class='open'>Open FRD<input id='file' type='file' accept='.frd'></label></header><main><aside><section><h3>RESULT</h3><label>Step<select id='step'></select></label><label>Frame<select id='frame'></select></label><label>Field<select id='field'></select></label><label>Component<select id='component'></select></label></section><section><h3>DISPLAY</h3><label>Interpolation<select id='interp'><option value='shape'>Shape function</option><option value='classic'>Classic</option></select></label><label>Deformation <input id='deform' type='range' min='0' max='5' value='0' step='.1'></label><label class='row'><input id='edges' type='checkbox'> Element edges</label></section><section><h3>RANGE</h3><label>Min<input id='min' type='number' step='any'></label><label>Max<input id='max' type='number' step='any'></label><button id='auto'>Auto range</button></section><div id='stats'></div></aside><div id='view'><canvas id='gl'></canvas><div id='drop'><b>Drop an FRD file</b><span>CalculiX / OpenCAE result files stay on this device.</span></div><div id='legend'><div id='legendTitle'>—</div><div class='bar'></div><div class='ticks'><span id='lmax'>—</span><span id='lmid'>—</span><span id='lmin'>—</span></div></div><div class='hint'>LMB rotate · RMB pan · wheel zoom</div></div></main><script type='module' src='./app.js'></script></body></html>
