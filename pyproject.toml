[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencae-studio"
version = "0.15.2"
description = "Open-source CAE pre- and post-processing desktop application"
requires-python = ">=3.11"
dependencies = [
  "PyQt6",
  "numpy",
  "pyvista @ git+https://github.com/pyvista/pyvista.git@3ce36e3b72e5d73c10adf19256aeef6529579cc7",
  "pyvistaqt @ git+https://github.com/pyvista/pyvistaqt.git@c3fe1074dcb77bff723968b33a63181c08975f74",
  "vtk==9.7.0",
  "gmsh",
]

[project.scripts]
opencae-studio = "opencae.app.application:run"

[tool.setuptools.packages.find]
include = ["opencae*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
