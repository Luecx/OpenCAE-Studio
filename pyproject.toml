[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencae-studio"
version = "0.15.2"
description = "Open-source CAE pre- and post-processing desktop application"
requires-python = ">=3.11"
dependencies = [
  "PyQt6",
  "numpy",
  "pyvista",
  "pyvistaqt",
  "vtk",
  "gmsh",
]

[project.scripts]
opencae-studio = "opencae.app.application:run"

[tool.setuptools.packages.find]
include = ["opencae*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
