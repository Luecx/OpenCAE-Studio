[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencae-studio"
version = "0.12.1"
description = "Modular PyQt6 CAE desktop prototype"
requires-python = ">=3.11"
dependencies = ["PyQt6>=6.6", "numpy>=1.26", "pyvista>=0.48,<0.49", "pyvistaqt>=0.12,<0.13", "gmsh>=4.13"]

[project.scripts]
opencae = "opencae.app.application:run"

[tool.setuptools.packages.find]
include = ["opencae*"]

[tool.setuptools.package-data]
"opencae" = ["ui/assets/*.png", "ui/assets/*.ico"]
