name: Python tests

on:
  push:
    branches:
      - master
      - agent/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglu1-mesa libxkbcommon-x11-0
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python sources
        run: python -m compileall -q opencae tests
      - name: Run maintained regression tests
        run: |
          python -m pytest -q \
            tests/test_analysis_study_jobs.py \
            tests/test_topology_optimization.py \
            tests/test_topology_density_regressions.py \
            tests/test_optimization_public_api.py \
            tests/test_job_action_contracts.py \
            tests/test_workflow_ui_regressions.py
