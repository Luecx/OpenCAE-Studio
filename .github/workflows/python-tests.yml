name: Python tests

on:
  push:
    branches:
      - master
      - agent/**
      - refactor/**
      - ui/**
      - workflow/**
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
      PYVISTA_OFF_SCREEN: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libglu1-mesa libxkbcommon-x11-0
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pytest
      - name: Compile Python sources
        run: python -m compileall -q opencae tests
      - name: Run deck format and pipeline regressions
        run: >-
          python -m pytest -q
          tests/test_deck_format_manager.py
          tests/test_deck_profile_pipeline.py
          tests/test_analysis_deck_profile_selection.py
      - name: Diagnose remaining full-suite regressions
        run: python -m pytest -vv --maxfail=20 tests
